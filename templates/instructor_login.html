{% extends "base.html" %}

{% block title %}Instructor Login - Popping{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <span class="logo-large">🍿</span>
            <h1>Instructor Login</h1>
            <p class="subtitle">Access your course control panels</p>
        </div>

        <form method="POST" action="{{ url_for('instructor_login') }}" class="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required
                       placeholder="Enter your username" autocomplete="off">
            </div>
            <div class="form-group">
                <label for="pin">PIN</label>
                <input type="password" id="pin" name="pin" required
                       placeholder="Enter your PIN">
            </div>
            <button type="submit" class="btn btn-primary btn-full">Log In</button>
        </form>

        <div class="login-footer">
            <a href="{{ url_for('index') }}">← Back to course selection</a>
        </div>
    </div>
</div>
{% endblock %}
