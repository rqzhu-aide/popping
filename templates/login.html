{% extends "base.html" %}

{% block title %}Login - {{ course.name }}{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <span class="logo-large">🍿</span>
            <h1>{{ course.name }}</h1>
            <p class="subtitle">
                {% if course.code %}{{ course.code }}{% endif %}
                {% if course.semester %} · {{ course.semester }}{% endif %}
            </p>
        </div>

        <form method="POST" action="{{ url_for('login', slug=slug) }}" class="login-form">
            <div class="form-group">
                <label for="student_id">Student ID</label>
                <input type="text" id="student_id" name="student_id" required
                       placeholder="Enter your student ID" autocomplete="off">
            </div>
            <div class="form-group">
                <label for="pin">PIN</label>
                <input type="password" id="pin" name="pin" required
                       placeholder="Enter your PIN">
            </div>
            <div class="form-group">
                <label for="name">Your Name <span class="hint-inline">(optional — set on first login)</span></label>
                <input type="text" id="name" name="name"
                       placeholder="e.g. John" autocomplete="off">
            </div>
            <button type="submit" class="btn btn-primary btn-full">Join Class</button>
        </form>

        <div class="login-footer">
            <a href="{{ url_for('index') }}">← Back to course selection</a>
        </div>
    </div>
</div>
{% endblock %}
