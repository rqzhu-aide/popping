{% extends "base.html" %}

{% block title %}Login - Popping{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <span class="logo-large">🍿</span>
            <h1>Welcome to Popping</h1>
            <p class="subtitle">Team-based learning & peer grading</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}" class="login-form">
            <div class="form-group">
                <label for="student_id">Student ID</label>
                <input type="text" id="student_id" name="student_id" required
                       placeholder="Enter your student ID" autocomplete="off">
            </div>
            <div class="form-group">
                <label for="pin">PIN</label>
                <input type="password" id="pin" name="pin" required
                       placeholder="Enter your PIN">
            </div>
            <button type="submit" class="btn btn-primary btn-full">Join Class</button>
        </form>

        <div class="login-footer">
            <p>Instructor? Use your instructor ID and PIN.</p>
        </div>
    </div>
</div>
{% endblock %}
